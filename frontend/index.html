<head>

<title>PlurkoTech | Silicon-Proven Semiconductor IP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Raleway:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Plurko Technologies",
  "url": "https://plurkotech.com",
  "logo": "https://plurkotech.com/assets/images/logo-dark.png",
  "description": "Silicon-proven semiconductor IP provider offering 302+ production-ready IP cores from verified vendors worldwide.",
  "foundingDate": "2001",

    "https://www.linkedin.com/company/plurkotech",
    "https://twitter.com/plurkotech"
  ],

    "contactType": "sales",
    "availableLanguage": ["English"]

}

<script>
  /* Apply saved theme before paint to avoid a flash */
  (function () {
    try {
      var t = localStorage.getItem('plurko-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  /* Skeleton loading screen — shown until React + the page chunk are ready.
     Inline so it renders before any app CSS/JS loads. Theme-aware. */
  .app-skeleton{position:fixed;inset:0;z-index:99999;background:#FFFFFF;overflow:hidden}
  [data-theme="dark"] .app-skeleton{background:#1A1A1E}
  .sk-shimmer{position:relative;overflow:hidden;background:rgba(34,34,34,0.06);border-radius:8px}
  [data-theme="dark"] .sk-shimmer{background:rgba(255,255,255,0.06)}
  .sk-shimmer::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(34,34,34,0.07),transparent);animation:skShimmer 1.4s infinite}
  [data-theme="dark"] .sk-shimmer::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,0.09),transparent)}
  @keyframes skShimmer{100%{transform:translateX(100%)}}
  .sk-header{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;
    justify-content:space-between;padding:0 clamp(24px,4vw,80px);border-bottom:1px solid rgba(34,34,34,0.06)}
  [data-theme="dark"] .sk-header{border-bottom-color:rgba(255,255,255,0.06)}
  .sk-logo{width:120px;height:24px}
  .sk-actions{display:flex;align-items:center;gap:14px}
  .sk-pill{width:90px;height:30px;border-radius:100px}
  .sk-dot{width:38px;height:38px;border-radius:50%}
  .sk-hero{position:absolute;left:clamp(24px,4vw,80px);bottom:14vh;display:flex;flex-direction:column;
    gap:18px;max-width:680px;width:80%}
  .sk-line{height:42px;border-radius:10px}
  .sk-line.sk-sm{height:16px}
  .sk-btn{width:200px;height:46px;border-radius:100px;margin-top:10px}
  @media(max-width:768px){.sk-line{height:30px}.sk-hero{bottom:10vh}}
  @media(prefers-reduced-motion:reduce){.sk-shimmer::after{animation:none}}
</style>
<script src="/assets/js/gsap.min.js"></script>
<script src="/assets/js/ScrollTrigger.min.js"></script>
</head>
<body class="theme-trans">
<div id="root">
  <div class="app-skeleton" role="status" aria-label="Loading">
    <div class="sk-header">
      <div class="sk-logo sk-shimmer"></div>
      <div class="sk-actions">
        <div class="sk-pill sk-shimmer"></div>
        <div class="sk-dot sk-shimmer"></div>
      </div>
    </div>
    <div class="sk-hero">
      <div class="sk-line sk-shimmer" style="width:62%"></div>
      <div class="sk-line sk-shimmer" style="width:48%"></div>
      <div class="sk-line sk-sm sk-shimmer" style="width:38%"></div>
      <div class="sk-btn sk-shimmer"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>

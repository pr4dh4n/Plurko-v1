# Local dev Postgres only (the API runs from your venv against this).
# Productionizing later: managed RDS instead, API behind nginx on EC2.
services:
  db:
    image: postgres:16
    container_name: plurko-postgres
    environment:
      POSTGRES_USER: plurko
      POSTGRES_PASSWORD: plurko
      POSTGRES_DB: plurko
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plurko"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
